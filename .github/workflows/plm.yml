name: plm
on:
  push:
    branches: [main, develop, "wp/**"]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # suspects compare against the confirmed versions in the history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install plm at the pinned version
        run: |
          v=$(cat .plm-version)
          npm install -g "https://github.com/florian-bridges/PLM/releases/download/$v/plm-${v#v}.tgz"
      - name: Method checks (owners, requirement wording, lengths)
        run: python3 scripts/check.py
      - name: plm validate
        run: plm validate
      - name: plm suspects
        run: |
          plm suspects
          test "$(plm suspects --format json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).data.length))')" = 0
